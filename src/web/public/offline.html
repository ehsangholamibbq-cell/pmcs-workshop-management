<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#112a2a" />
    <title>بدون اتصال | سامانه کنترل مدیریت پروژه</title>
    <style>
      :root { color-scheme: light; font-family: Tahoma, Arial, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #edf1eb; color: #142a29; }
      main { width: min(34rem, calc(100% - 2rem)); box-sizing: border-box; padding: 2rem; background: #fff; border: 1px solid #d8e0d7; border-radius: 1.25rem; box-shadow: 0 1rem 3rem rgba(17, 42, 42, .12); }
      span { display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 1rem; background: #173d3a; color: #fff; font-size: 1.5rem; }
      h1 { margin: 1.25rem 0 .75rem; font-size: 1.5rem; }
      p { margin: 0; line-height: 1.9; color: #526462; }
      button { margin-top: 1.5rem; width: 100%; padding: .85rem; border: 0; border-radius: .75rem; background: #b56a3b; color: #fff; font: inherit; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <span>پ</span>
      <h1>اتصال به سامانه برقرار نیست</h1>
      <p>برای بازکردن نشست امن دوباره متصل شوید. اطلاعات ورود یا صفحه‌های دارای داده پروژه در حافظه عمومی مرورگر نگهداری نمی‌شوند.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </main>
  </body>
</html>
