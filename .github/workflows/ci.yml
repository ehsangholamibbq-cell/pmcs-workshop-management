name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    env:
      PMCS_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/qa/regression-runner.mjs run architecture
      - name: Record V1.1 candidate preflight
        run: node tools/qa/v1.1-candidate-preflight.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-architecture
          path: artifacts/qa/regression/architecture.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmcs-vx-g4-consumer-inventory
          path: artifacts/qa/vx-g4-consumers.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmcs-v1.1-candidate-manifest
          path: artifacts/qa/v1.1-evidence/candidate-manifest*
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: node tools/qa/regression-runner.mjs run backend
        env:
          PMCS_PDF_QUALIFICATION_OUTPUT: ${{ github.workspace }}/artifacts/qa/ms48-font-golden
          PMCS_F02_RENDER_QUALIFICATION_OUTPUT: ${{ github.workspace }}/artifacts/qa/ms48-font-golden
          PMCS_F03_RENDER_QUALIFICATION_OUTPUT: ${{ github.workspace }}/artifacts/qa/ms48-font-golden
          PMCS_F04_RENDER_QUALIFICATION_OUTPUT: ${{ github.workspace }}/artifacts/qa/ms48-font-golden
          PMCS_F05_RENDER_QUALIFICATION_OUTPUT: ${{ github.workspace }}/artifacts/qa/ms48-font-golden
          PMCS_F06_RENDER_QUALIFICATION_OUTPUT: ${{ github.workspace }}/artifacts/qa/ms48-font-golden
          PMCS_F07_RENDER_QUALIFICATION_OUTPUT: ${{ github.workspace }}/artifacts/qa/ms48-font-golden
          PMCS_MS48_FONT_QUALIFICATION_OUTPUT: ${{ github.workspace }}/artifacts/qa/ms48-font-golden
      - name: Render isolated MS45 PDF and XLSX font review
        env:
          PMCS_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: dotnet run --project tools/qa/FontReview/FontReview.csproj --configuration Release -- --output artifacts/qa/ms45-font-review
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-backend
          path: artifacts/qa/regression/backend.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmcs-ms48-font-golden-candidate
          path: artifacts/qa/ms48-font-golden/
          if-no-files-found: ignore
      - if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pmcs-ms45-font-review
          path: artifacts/qa/ms45-font-review/
          if-no-files-found: error

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pmcs_integration
          POSTGRES_USER: pmcs
          POSTGRES_PASSWORD: pmcs_integration_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pmcs -d pmcs_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PMCS_TEST_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=pmcs_integration;Username=pmcs;Password=pmcs_integration_only
      PMCS_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      PMCS_TEST_S3_ACCESS_KEY: pmcs_integration
      PMCS_TEST_S3_SECRET_KEY: pmcs_integration_only
      PMCS_TEST_S3_BUCKET: pmcs-integration
      PMCS_VERIFICATION_DATABASE_URL: postgresql://pmcs:pmcs_integration_only@127.0.0.1:5432/pmcs_integration
      PMCS_QA_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=pmcs_qa_integration;Username=pmcs;Password=pmcs_integration_only
      PMCS_QA_DATABASE_URL: postgresql://pmcs:pmcs_integration_only@127.0.0.1:5432/pmcs_qa_integration
      PMCS_QA_DATABASE_NAME: pmcs_qa_integration
      PMCS_QA_RESET_CONFIRM: RESET:pmcs_qa_integration
      PMCS_QA_AUTH_KEY: qa-ci-independent-key-0123456789abcdef
      PMCS_QA_S3_ENDPOINT: http://127.0.0.1:9000
      PMCS_QA_S3_ACCESS_KEY: pmcs_integration
      PMCS_QA_S3_SECRET_KEY: pmcs_integration_only
      PMCS_QA_S3_BUCKET: pmcs-qa-integration
      PMCS_BACKUP_CONNECTION_STRING: postgresql://pmcs:pmcs_integration_only@127.0.0.1:5432/pmcs_integration
      PMCS_RESTORE_ADMIN_CONNECTION_STRING: postgresql://pmcs:pmcs_integration_only@127.0.0.1:5432/postgres
      PMCS_RESTORE_TARGET_CONNECTION_STRING: postgresql://pmcs:pmcs_integration_only@127.0.0.1:5432/pmcs_restore_drill_ci
      PMCS_RESTORE_TARGET_DATABASE: pmcs_restore_drill_ci
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: pmcs
      PGPASSWORD: pmcs_integration_only
      PMCS_V1_UPGRADE_CONNECTION_STRING: Host=127.0.0.1;Port=5432;Database=pmcs_qa_v1_upgrade;Username=pmcs;Password=pmcs_integration_only
      PMCS_V1_UPGRADE_DATABASE_URL: postgresql://pmcs:pmcs_integration_only@127.0.0.1:5432/pmcs_qa_v1_upgrade
      PMCS_V1_RESTORE_DATABASE_URL: postgresql://pmcs:pmcs_integration_only@127.0.0.1:5432/pmcs_restore_drill_v1_upgrade
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Start isolated object storage
        run: |
          docker build --tag pmcs-integration-minio:local --file deploy/minio/Dockerfile .
          docker run --detach --name pmcs-integration-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=pmcs_integration \
            --env MINIO_ROOT_PASSWORD=pmcs_integration_only \
            pmcs-integration-minio:local server /data
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/live >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs pmcs-integration-minio
          exit 1
      - name: Run connected integration regression
        run: node tools/qa/regression-runner.mjs run integration
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-integration
          path: artifacts/qa/regression/integration.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmcs-v1.1-int1-dormant
          path: artifacts/qa/v1.1-evidence/int1-dormant*
          if-no-files-found: error
      - if: failure()
        run: docker logs pmcs-integration-minio || true
      - if: always()
        run: docker rm --force pmcs-integration-minio || true

  pilot-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/qa/regression-runner.mjs run pilot-contract
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-pilot-contract
          path: artifacts/qa/regression/pilot-contract.json
          if-no-files-found: error

  web:
    runs-on: ubuntu-latest
    env:
      PMCS_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/qa/regression-runner.mjs run web
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-web
          path: artifacts/qa/regression/web.json
          if-no-files-found: error
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmcs-vx-g5-build-budget
          path: artifacts/qa/vx-g5-build-budget.json
          if-no-files-found: error

  ui-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      PMCS_DEMO_USER_PASSWORD: Pmcs-E2E-only-2026!
      PMCS_E2E_USER_EMAIL: demo@pmcs.local
      PMCS_E2E_USER_PASSWORD: Pmcs-E2E-only-2026!
      PMCS_E2E_ADMIN_CLIENT_SECRET: identity_admin_dev_only
      PMCS_E2E_BASE_URL: http://localhost:3000
      PMCS_GENERAL_PERMIT_LIMIT: "10000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - name: Install Web and browser dependencies
        working-directory: src/web
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox webkit
          if ! command -v pdftotext >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y poppler-utils
          fi
      - name: Start isolated full application stack
        run: docker compose up --detach --build
      - name: Wait for OIDC, API and Web readiness
        run: |
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:8081/realms/pmcs/.well-known/openid-configuration >/dev/null && \
               curl --fail --silent http://localhost:8080/health/ready >/dev/null && \
               curl --fail --silent http://localhost:3000/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          exit 1
      - name: Prepare isolated OIDC browser fixture
        run: node tools/qa/prepare-ui-e2e.mjs
      - name: Verify real browser login, RTL, responsive and offline recovery
        env:
          PMCS_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/qa/regression-runner.mjs run ui-e2e
      - name: Verify complete VX-G1 screenshot inventory and record SHA-256 index
        env:
          PMCS_SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node tools/qa/visual-baseline.mjs verify
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-regression-ui-e2e
          path: artifacts/qa/regression/ui-e2e.json
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pmcs-ui-e2e-failure-context
          path: |
            src/web/test-results/**/error-context.md
            src/web/test-results/**/*.png
          if-no-files-found: ignore
      - if: success()
        uses: actions/upload-artifact@v4
        with:
