global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/reporting-alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [127.0.0.1:9093]

scrape_configs:
  - job_name: pmcs-reporting
    static_configs:
      - targets: [127.0.0.1:9464]

